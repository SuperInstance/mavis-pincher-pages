<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · SuperInstance</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>Search</h1>
      <form id="search-form" class="search" action="/search.html" method="get">
        <input id="search-input" name="q" type="search" autocomplete="off"
               placeholder="ask the pincher" aria-label="Search">
        <button type="submit">Ask</button>
      </form>
      <p class="hero-meta"><a href="/">← back to fleet</a></p>
    </div>
  </header>

  <main class="search-results">
    <h2 id="results-header">Results</h2>
    <div id="results"></div>
  </main>

  <script>
    const PINCHER = window.PINCHER_URL || 'https://superinstance.dev';
    const params = new URLSearchParams(location.search);
    const q = params.get('q') ?? '';
    if (q) {
      document.getElementById('search-input').value = q;
      document.getElementById('results-header').textContent = `Results for "${q}"`;
      fetch(`${PINCHER}/v1/search?q=${encodeURIComponent(q)}&k=20`)
        .then(r => r.json())
        .then(d => {
          const el = document.getElementById('results');
          if (!d.results || d.results.length === 0) {
            el.innerHTML = '<p>No matches. Try a broader query.</p>';
            return;
          }
          el.innerHTML = d.results.map(r => `
            <div class="result">
              <h3>${r.owner}/${r.name} <span class="score">score ${r.score}</span></h3>
              <p class="desc">${r.description || ''}</p>
              <p><a href="${r.html_url}" target="_blank">${r.html_url}</a></p>
            </div>`).join('');
        })
        .catch(e => {
          document.getElementById('results').innerHTML = '<p>Search failed. Pincher may be down.</p>';
        });
    } else {
      document.getElementById('results-header').textContent = 'Enter a query above';
    }
  </script>
</body>
</html>
